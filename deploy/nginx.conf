server {
    server_name seniori.org www.seniori.org;

    location / {
        proxy_pass http://127.0.0.1:5051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/seniori.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/seniori.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.seniori.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = seniori.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name seniori.org www.seniori.org;
    return 404; # managed by Certbot




}