<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0B1F4D">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>Senior Radio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0B1F4D;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 0;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #8FA0C8;
      font-size: 16px;
      margin-bottom: 48px;
    }

    .buttons {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    button {
      background: #1B3A8A;
      border: none;
      border-radius: 16px;
      min-height: 120px;
      width: 100%;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.97); }
    button.playing { background: #C0392B; }

    .btn-label {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
    }

    .btn-time {
      font-size: 18px;
      font-weight: 400;
      color: rgba(255,255,255,0.75);
    }

    .progress-box {
      width: 100%;
      max-width: 480px;
      margin-top: 40px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #2A3F7A;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #4A90E2;
      border-radius: 3px;
      width: 0%;
      transition: width 0.5s linear;
    }

    .timer {
      color: #8FA0C8;
      font-size: 14px;
      margin-top: 8px;
      text-align: center;
    }

    .offline-note {
      color: #E8A838;
      font-size: 13px;
      margin-top: 6px;
      text-align: center;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Senior Radio</h1>
  <p class="subtitle">HRT Radio</p>

  <div class="buttons">
    <button id="btn-vijesti" onclick="toggle('vijesti')">
      <span class="btn-label">VIJESTI</span>
      <span class="btn-time" id="time-vijesti"></span>
    </button>
    <button id="btn-dnevnik" onclick="toggle('dnevnik')">
      <span class="btn-label">DNEVNIK</span>
      <span class="btn-time" id="time-dnevnik"></span>
    </button>
  </div>

  <div class="progress-box" id="progress-box" style="display:none">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="timer" id="timer"></div>
    <div class="offline-note" id="offline-note" style="display:none">Reproducira se snimljena kopija</div>
  </div>

  <audio id="player" preload="none"></audio>

  <script>
    const player = document.getElementById('player');
    let current = null;
    let rafId = null;

    const cache = {};
    const CACHE_TTL = 15 * 60 * 1000;

    async function getTrack(slug) {
      const now = Date.now();
      const stored = localStorage.getItem('sr:' + slug);
      if (cache[slug] && now - cache[slug].ts < CACHE_TTL) return cache[slug].data;

      try {
        const r = await fetch('/api/' + slug);
        if (!r.ok) throw new Error('HTTP_' + r.status);
        const data = await r.json();
        if (data.error) throw new Error(data.error);
        cache[slug] = { data, ts: now };
        localStorage.setItem('sr:' + slug, JSON.stringify({ ...data, offline: true }));
        return data;
      } catch (e) {
        if (stored) return JSON.parse(stored);
        throw e;
      }
    }

    function formatBroadcastTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      return `${day}.${month}. u ${h}:${m}`;
    }

    function formatMs(ms) {
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function setLoading(slug) {
      const btn = document.getElementById('btn-' + slug);
      btn.querySelector('.btn-label').innerHTML = '<div class="spinner"></div>';
    }

    function setLabel(slug, playing) {
      const btn = document.getElementById('btn-' + slug);
      btn.querySelector('.btn-label').textContent = (playing ? '■ ' : '') + slug.toUpperCase();
      btn.classList.toggle('playing', playing);
    }

    function stopAll() {
      if (current) {
        setLabel(current, false);
        current = null;
      }
      player.pause();
      player.src = '';
      cancelAnimationFrame(rafId);
      document.getElementById('progress-box').style.display = 'none';
    }

    function updateProgress() {
      if (!player.duration) return;
      const pct = (player.currentTime / player.duration) * 100;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('timer').textContent =
        formatMs(player.currentTime * 1000) + ' / ' + formatMs(player.duration * 1000);
      rafId = requestAnimationFrame(updateProgress);
    }

    async function toggle(slug) {
      if (current === slug) { stopAll(); return; }
      stopAll();

      setLoading(slug);
      try {
        const track = await getTrack(slug);

        document.getElementById('time-' + slug).textContent = formatBroadcastTime(track.broadcastStart);

        fetch('/ping/' + slug).catch(() => {});
        player.src = track.url;
        await player.play();

        current = slug;
        setLabel(slug, true);
        document.getElementById('progress-box').style.display = 'block';
        document.getElementById('offline-note').style.display = track.offline ? 'block' : 'none';
        rafId = requestAnimationFrame(updateProgress);

        player.onended = () => { stopAll(); };
      } catch (e) {
        setLabel(slug, false);
        alert('Greška: ' + (e.message || 'Pokušajte ponovo.'));
      }
    }

    // Prefetch broadcast times on load
    ['vijesti', 'dnevnik'].forEach(async slug => {
      try {
        const t = await getTrack(slug);
        document.getElementById('time-' + slug).textContent = formatBroadcastTime(t.broadcastStart);
      } catch (_) {}
    });

    player.onended = () => stopAll();
  </script>
</body>
</html>
