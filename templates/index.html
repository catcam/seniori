<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0B1F4D">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>Senior Radio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0B1F4D;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 0;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #8FA0C8;
      font-size: 16px;
      margin-bottom: 48px;
    }

    .buttons {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    button {
      background: #1B3A8A;
      border: none;
      border-radius: 16px;
      min-height: 120px;
      width: 100%;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.97); }
    button.playing { background: #C0392B; }

    .btn-label {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
    }

    .btn-time {
      font-size: 18px;
      font-weight: 400;
      color: rgba(255,255,255,0.75);
    }

    .progress-box {
      width: 100%;
      max-width: 480px;
      margin-top: 40px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #2A3F7A;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #4A90E2;
      border-radius: 3px;
      width: 0%;
      transition: width 0.5s linear;
    }

    .timer {
      color: #8FA0C8;
      font-size: 14px;
      margin-top: 8px;
      text-align: center;
    }

    .offline-note {
      color: #E8A838;
      font-size: 13px;
      margin-top: 6px;
      text-align: center;
    }

    .app-links {
      display: flex;
      gap: 12px;
      margin-top: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .app-link {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1B3A8A;
      border-radius: 12px;
      padding: 10px 18px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s;
    }

    .app-link:hover { background: #2A4FAA; }

    .app-link svg {
      flex-shrink: 0;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Senior Radio</h1>
  <p class="subtitle">HRT Radio</p>

  <div class="buttons">
    <button id="btn-vijesti" onclick="toggle('vijesti')">
      <span class="btn-label">VIJESTI</span>
      <span class="btn-time" id="time-vijesti"></span>
    </button>
    <button id="btn-dnevnik" onclick="toggle('dnevnik')">
      <span class="btn-label">DNEVNIK</span>
      <span class="btn-time" id="time-dnevnik"></span>
    </button>
  </div>

  <div class="progress-box" id="progress-box" style="display:none">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="timer" id="timer"></div>
    <div class="offline-note" id="offline-note" style="display:none">Reproducira se snimljena kopija</div>
  </div>

  <audio id="player" preload="none"></audio>

  <div class="app-links">
    <a class="app-link" href="https://github.com/catcam/senior-radio/releases/latest/download/senior-radio.apk" download>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5S11 23.33 11 22.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zM12 1c-.96 0-1.86.23-2.66.63L7.85.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31C6.97 3.26 6 5.01 6 7h12c0-1.99-.97-3.75-2.47-4.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.49 1.48C13.86 1.23 12.95 1 12 1zm-2 4.5c-.28 0-.5-.22-.5-.5s.22-.5.5-.5.5.22.5.5-.22.5-.5.5zm4 0c-.28 0-.5-.22-.5-.5s.22-.5.5-.5.5.22.5.5-.22.5-.5.5z"/>
      </svg>
      Android
    </a>
    <a class="app-link" href="https://seniori.org" id="ios-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>
      iPhone / iPad
    </a>
  </div>

  <!-- iOS uputa overlay -->
  <div id="ios-overlay" style="display:none; position:fixed; inset:0; background:rgba(11,31,77,0.97); z-index:100; flex-direction:column; align-items:center; justify-content:center; padding:32px; text-align:center;">
    <div style="font-size:64px; margin-bottom:24px;">📱</div>
    <div style="font-size:28px; font-weight:800; margin-bottom:32px; line-height:1.3;">Dodaj na početni zaslon</div>
    <div style="font-size:22px; line-height:1.8; color:#C8D8F8;">
      1. Pritisni <strong style="color:#fff;">Dijeli</strong><br>
      <span style="font-size:36px;">⬆️</span><br>
      2. Odaberi <strong style="color:#fff;">Dodaj na početni zaslon</strong><br>
      3. Pritisni <strong style="color:#fff;">Dodaj</strong>
    </div>
    <button onclick="document.getElementById('ios-overlay').style.display='none'"
      style="margin-top:48px; background:#1B3A8A; border:none; border-radius:16px; color:#fff; font-size:22px; font-weight:700; padding:18px 48px; cursor:pointer;">
      Zatvori
    </button>
  </div>

  <p style="color:#2A3F7A;font-size:11px;margin-top:24px;text-align:center;">Nikša Barlović &amp; Claude · Anthropic</p>

  <script>
    document.getElementById('ios-link').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('ios-overlay').style.display = 'flex';
    });
  </script>

  <script>
    const player = document.getElementById('player');
    let current = null;
    let rafId = null;

    const cache = {};
    const CACHE_TTL = 15 * 60 * 1000;

    async function getTrack(slug) {
      const now = Date.now();
      const stored = localStorage.getItem('sr:' + slug);
      if (cache[slug] && now - cache[slug].ts < CACHE_TTL) return cache[slug].data;

      try {
        const r = await fetch('/api/' + slug);
        if (!r.ok) throw new Error('HTTP_' + r.status);
        const data = await r.json();
        if (data.error) throw new Error(data.error);
        cache[slug] = { data, ts: now };
        localStorage.setItem('sr:' + slug, JSON.stringify({ ...data, offline: true }));
        return data;
      } catch (e) {
        if (stored) return JSON.parse(stored);
        throw e;
      }
    }

    function formatBroadcastTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      return `${day}.${month}. u ${h}:${m}`;
    }

    function formatMs(ms) {
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function setLoading(slug) {
      const btn = document.getElementById('btn-' + slug);
      btn.querySelector('.btn-label').innerHTML = '<div class="spinner"></div>';
    }

    function setLabel(slug, playing) {
      const btn = document.getElementById('btn-' + slug);
      btn.querySelector('.btn-label').textContent = (playing ? '■ ' : '') + slug.toUpperCase();
      btn.classList.toggle('playing', playing);
    }

    function stopAll() {
      if (current) {
        setLabel(current, false);
        current = null;
      }
      player.pause();
      player.src = '';
      cancelAnimationFrame(rafId);
      document.getElementById('progress-box').style.display = 'none';
    }

    function updateProgress() {
      if (!player.duration) return;
      const pct = (player.currentTime / player.duration) * 100;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('timer').textContent =
        formatMs(player.currentTime * 1000) + ' / ' + formatMs(player.duration * 1000);
      rafId = requestAnimationFrame(updateProgress);
    }

    async function toggle(slug) {
      if (current === slug) { stopAll(); return; }
      stopAll();

      setLoading(slug);
      try {
        const track = await getTrack(slug);

        document.getElementById('time-' + slug).textContent = formatBroadcastTime(track.broadcastStart);

        fetch('/ping/' + slug).catch(() => {});
        player.src = track.url;
        await player.play();

        current = slug;
        setLabel(slug, true);
        document.getElementById('progress-box').style.display = 'block';
        document.getElementById('offline-note').style.display = track.offline ? 'block' : 'none';
        rafId = requestAnimationFrame(updateProgress);

        player.onended = () => { stopAll(); };
      } catch (e) {
        setLabel(slug, false);
        alert('Greška: ' + (e.message || 'Pokušajte ponovo.'));
      }
    }

    // Prefetch broadcast times on load
    ['vijesti', 'dnevnik'].forEach(async slug => {
      try {
        const t = await getTrack(slug);
        document.getElementById('time-' + slug).textContent = formatBroadcastTime(t.broadcastStart);
      } catch (_) {}
    });

    player.onended = () => stopAll();
  </script>
</body>
</html>
